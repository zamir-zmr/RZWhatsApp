    <div id="chat-interface">


<div class="chat-header">
    <div class="header-left">
        <div class="header-avatar" id="user-initial">?</div>

            <div id="display-name" style="font-size: 16px; font-weight: 600;">Partner</div>

            <input type="text" id="msg-input" placeholder="Type a message" 
                   oninput="handleTyping()" 
                   onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">➔</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA3bsKfP7CxS0Sb0CY6xu_vFogVcxbJCII",
            authDomain: "ashcostingapp.firebaseapp.com",
            databaseURL: "https://ashcostingapp-default-rtdb.firebaseio.com",
            projectId: "ashcostingapp",
            storageBucket: "ashcostingapp.firebasestorage.app",
            messagingSenderId: "576053214259",
            appId: "1:576053214259:web:e47a6c38721d62580fb746"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";
        let typingTimeout;


// Sirf ye EK window.onload rakhein
window.onload = () => {
    const saved = localStorage.getItem("ash_chat_user");
    
    // Sabse pehle popup aur overlay ko hidden confirm karein
    document.getElementById('error-popup').style.display = "none";
    document.getElementById('blur-overlay').style.display = "none";

    if (saved) {
        // Agar pehle se login hai, toh seedha chat dikhao
        setupChat(saved); 
    } else {
        // Agar login nahi hai, sirf tabhi login screen dikhao
        document.getElementById('login-screen').style.display = "flex";
        document.getElementById('chat-interface').style.display = "none";
    }
};
function login() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    const popup = document.getElementById('error-popup');
    const overlay = document.getElementById('blur-overlay');
    const msgText = document.getElementById('error-message-text');

    popup.classList.remove('shake-animation'); // Reset animation

    let errorMessage = "";

    // Validation sequence
    if (u === "") {
        errorMessage = "Please first enter your Name";
    } else if (p === "") {
        errorMessage = "Please enter your Password";
    } else if (u !== "Zamir" && u !== "Rahima") {
        errorMessage = "Wrong Username! This user is not registered.";
    } else if (p !== "123") {
        errorMessage = "Wrong Password! Access Denied.";
        popup.classList.add('shake-animation'); // Shake only on wrong password
    }

    if (errorMessage !== "") {
        msgText.innerText = errorMessage;
        popup.style.display = 'block';
        overlay.style.display = 'block';
        return;
    }

    // Success logic
    localStorage.setItem("ash_chat_user", u);
    setupChat(u);
}

function closeError() {
    document.getElementById('error-popup').style.display = 'none';
    document.getElementById('blur-overlay').style.display = 'none';
}


function closeError() {
    document.getElementById('error-popup').style.display = 'none';
    document.getElementById('blur-overlay').style.display = 'none';
    document.getElementById('error-popup').classList.remove('shake-animation');
}


function closeError() {
    document.getElementById('error-popup').style.display = 'none';
    document.getElementById('blur-overlay').style.display = 'none';
    // Remove shake class so it can play again
    document.getElementById('error-popup').classList.remove('shake-animation');
}


// Popup dikhane ke liye helper function
function showError(msg) {
    document.getElementById('error-message-text').innerText = msg;
    document.getElementById('error-popup').style.display = 'block';
    document.getElementById('blur-overlay').style.display = 'block';
}

function closeError() {
    document.getElementById('error-popup').style.display = 'none';
    document.getElementById('blur-overlay').style.display = 'none';
}


function closeError() {
    document.getElementById('error-popup').style.display = 'none';
    document.getElementById('blur-overlay').style.display = 'none';
}

        // --- NEW: Typing Logic ---
        function handleTyping() {
            db.ref('typing/' + currentUser).set(true);
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                db.ref('typing/' + currentUser).set(false);
            }, 2000); // Hide "Typing..." after 2 seconds of silence
        }

        function setupChat(user) {
            currentUser = user;
            const talkingTo = (user === "Zamir") ? "Rahima" : "Zamir";
            
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('chat-interface').style.display = "flex";
            document.getElementById('display-name').innerText = talkingTo;
            document.getElementById('user-initial').innerText = talkingTo.charAt(0);

            // Online/Offline Status
            const myStatusRef = db.ref('status/' + user);
            db.ref('.info/connected').on('value', (snapshot) => {
                if (snapshot.val() === false) return;
                myStatusRef.onDisconnect().set('offline');
                myStatusRef.set('online');
            });

            // Monitor Partner's Status & Typing
            db.ref('status/' + talkingTo).on('value', (statusSnap) => {
                const status = statusSnap.val() || 'offline';
                const statusElement = document.getElementById('user-status');

                // Check Typing status from its own path
                db.ref('typing/' + talkingTo).on('value', (typingSnap) => {
                    if (typingSnap.val() === true) {
                        statusElement.innerText = "typing...";
                        statusElement.className = "status-text typing-indicator";
                    } else {
                        statusElement.innerText = status.charAt(0).toUpperCase() + status.slice(1);
                        statusElement.className = "status-text " + status;
                    }
                });
            });

            loadMessages();
        }

        function logout() {
            db.ref('status/' + currentUser).set('offline');
            db.ref('typing/' + currentUser).set(false);
            localStorage.removeItem("ash_chat_user");
            location.reload();
        }

        function sendMessage() {
            const inputField = document.getElementById('msg-input');
            const text = inputField.value;
            if (text.trim() === "") return;
            
            db.ref('typing/' + currentUser).set(false); // Stop typing status on send
            const timeNow = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
            
            db.ref('messages').push({
                sender: currentUser,
                text: text,
                time: timeNow
            });
            inputField.value = "";
        }

        function loadMessages() {
            const list = document.getElementById('message-list');
            db.ref('messages').on('child_added', (snapshot) => {
                const data = snapshot.val();
                const isMe = data.sender === currentUser;
                const bubble = document.createElement('div');
                bubble.className = `msg-bubble ${isMe ? 'sent' : 'received'}`;
                bubble.innerHTML = `
                    <div>${data.text}</div>
                    <div class="bubble-footer">
                        <span class="msg-time">${data.time}</span>
                        ${isMe ? '<span class="check-mark">✓✓</span>' : ''}
                    </div>
                `;
                list.appendChild(bubble);
                list.scrollTop = list.scrollHeight; 
            });
        }
        // Dropdown toggle karne ke liye
function toggleMenu() {
    const menu = document.getElementById('main-menu');
    menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
}

// Settings Modal ko kholne ke liye
function openSettings() {
    document.getElementById('settings-modal').style.display = 'flex';
    document.getElementById('main-menu').style.display = 'none';
}

// Firebase se History saaf karne ka function
function confirmClearChat() {
    if (confirm("Do you want to clear all messages for everyone?")) {
        db.ref('messages').remove().then(() => {
            document.getElementById('message-list').innerHTML = ""; // Screen saaf karein
            alert("Chat History Deleted.");
            closeChatHistory();
            closeSettings();
        }).catch(err => alert("Error: " + err.message));
    }
}

// Menu ke bahar click karne par menu apne aap band ho jaye
window.onclick = function(event) {
    if (!event.target.matches('.fa-ellipsis-vertical')) {
        const menu = document.getElementById('main-menu');
        if (menu) menu.style.display = 'none';
    }
};


function openSettings() {
    document.getElementById('settings-modal').style.display = 'flex';
    document.getElementById('main-menu').style.display = 'none';
}

function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

function openChatHistory() { document.getElementById('history-modal').style.display = 'flex'; }

function closeChatHistory() { document.getElementById('history-modal').style.display = 'none'; }

function confirmClearChat() {
    if (confirm("Are you sure you want to delete all messages?")) {
        // Firebase se messages delete karna
        db.ref('messages').remove().then(() => {
            alert("Chat history cleared!");
            document.getElementById('message-list').innerHTML = "";
            closeChatHistory();
            closeSettings();
        });
    }
}

// Menu ke bahar click karne par menu band ho jaye
window.onclick = function(event) {
    if (!event.target.matches('.fa-ellipsis-vertical')) {
        document.getElementById('main-menu').style.display = 'none';
    }
}

        
    </script>
