    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA3bsKfP7CxS0Sb0CY6xu_vFogVcxbJCII",
            authDomain: "ashcostingapp.firebaseapp.com",
            databaseURL: "https://ashcostingapp-default-rtdb.firebaseio.com",
            projectId: "ashcostingapp",
            storageBucket: "ashcostingapp.firebasestorage.app",
            messagingSenderId: "576053214259",
            appId: "1:576053214259:web:e47a6c38721d62580fb746"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = "";
        let typingTimeout;


// Sirf ye EK window.onload rakhein
window.onload = () => {
    const saved = localStorage.getItem("ash_chat_user");
    
    // Sabse pehle popup aur overlay ko hidden confirm karein
    document.getElementById('error-popup').style.display = "none";
    document.getElementById('blur-overlay').style.display = "none";

    if (saved) {
        // Agar pehle se login hai, toh seedha chat dikhao
        setupChat(saved); 
    } else {
        // Agar login nahi hai, sirf tabhi login screen dikhao
        document.getElementById('login-screen').style.display = "flex";
        document.getElementById('chat-interface').style.display = "none";
    }
};

function login() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    const popup = document.getElementById('error-popup');
    const overlay = document.getElementById('blur-overlay');
    const msgText = document.getElementById('error-message-text');

    // Reset animations
    popup.classList.remove('pop-up-show', 'shake-denied');

    let errorMessage = "";

    if (u === "") {
        errorMessage = "Please enter your Name";
    } else if (p === "") {
        errorMessage = "Please enter your Password";
    } else if (u !== "Zamir" && u !== "Rahima") {
        errorMessage = "Wrong Username!";
    } else if (p !== "123") {
        errorMessage = "Wrong Password! Access Denied.";
    }

    if (errorMessage !== "") {
        msgText.innerText = errorMessage;
        overlay.style.display = 'block';
        
        // Trigger Pop-in animation
        popup.classList.add('pop-up-show');

        // Agar user ya password galat hai, toh shake karein
        if(errorMessage.includes("Wrong")) {
            setTimeout(() => {
                popup.classList.add('shake-denied');
            }, 50);
        }
        return;
    }

    localStorage.setItem("ash_chat_user", u);
    setupChat(u);
}

function closeError() {
    const popup = document.getElementById('error-popup');
    const overlay = document.getElementById('blur-overlay');

    // 1. Animation classes remove karein taaki popup hide ho jaye
    popup.classList.remove('pop-up-show', 'shake-denied');
    
    // 2. Direct display none karein safety ke liye
    popup.style.display = 'none';
    overlay.style.display = 'none';
    
    // 3. Error text saaf karein
    document.getElementById('error-message-text').innerText = "";
}



// Popup dikhane ke liye helper function
function showError(msg) {
    document.getElementById('error-message-text').innerText = msg;
    document.getElementById('error-popup').style.display = 'block';
    document.getElementById('blur-overlay').style.display = 'block';
}




        // --- NEW: Typing Logic ---
        function handleTyping() {
            db.ref('typing/' + currentUser).set(true);
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                db.ref('typing/' + currentUser).set(false);
            }, 2000); // Hide "Typing..." after 2 seconds of silence
        }


function setupChat(user) {
    currentUser = user;
    const talkingTo = (user === "Zamir") ? "Rahima" : "Zamir";
    
    document.getElementById('login-screen').style.display = "none";
    document.getElementById('chat-interface').style.display = "flex";
    document.getElementById('display-name').innerText = talkingTo;
    document.getElementById('user-initial').innerText = talkingTo.charAt(0);

    // --- My Status Logic ---
    const myStatusRef = db.ref('status/' + user);
    db.ref('.info/connected').on('value', (snapshot) => {
        if (snapshot.val() === false) return;
        myStatusRef.onDisconnect().set(Date.now()); 
        myStatusRef.set('online');
    });

    // --- Monitor Friend's Status & Last Seen (CLEAN LOGIC) ---
    const statusElement = document.getElementById('user-status');
    
    db.ref('status/' + talkingTo).on('value', (statusSnap) => {
        const val = statusSnap.val();

        // 1. Pehle Typing check karein
        db.ref('typing/' + talkingTo).on('value', (typingSnap) => {
            if (typingSnap.val() === true) {
                statusElement.innerText = "typing...";
                statusElement.className = "status-text typing-indicator";
            } 
            // 2. Agar typing nahi hai toh status check karein
            else if (val === 'online') {
                statusElement.innerText = "Online";
                statusElement.className = "status-text online";
            } 
            // 3. Agar online nahi hai toh timing dikhayein
            else if (val && typeof val === 'number') {
                const lastTime = new Date(val).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                statusElement.innerText = "last seen today at " + lastTime;
                statusElement.className = "status-text offline";
            } 
            else {
                statusElement.innerText = "Offline";
                statusElement.className = "status-text offline";
            }
        });
    });

    loadMessages();

    // Instant Status Update (Minimize/Maximize)
    document.addEventListener("visibilitychange", () => {
        if (currentUser) {
            if (document.visibilityState === 'hidden') {
                db.ref('status/' + currentUser).set(Date.now());
            } else {
                db.ref('status/' + currentUser).set('online');
            }
        }
    });
}


function logout() {
    // Logout hote hi 'offline' ki jagah current time bhej dega
    if (currentUser) {
        db.ref('status/' + currentUser).set(Date.now());
        db.ref('typing/' + currentUser).set(false);
    }
    localStorage.removeItem("ash_chat_user");
    location.reload();
}

// Jab user tab close kare ya app minimize kare
window.onbeforeunload = function() {
    db.ref('status/' + currentUser).set(Date.now());
};



function sendMessage() {
    const inputField = document.getElementById('msg-input');
    const text = inputField.value;
    
    if (text.trim() === "") return;
    
    db.ref('typing/' + currentUser).set(false);
    
    const timeNow = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    
    db.ref('messages').push({
        sender: currentUser,
        text: text,
        time: timeNow,
        status: "sent",
        timestamp: Date.now() // Blue tick fix ke liye pehle bataya gaya timestamp
    });

    db.ref('last_notif').set({
        sender: currentUser,
        text: text,
        timestamp: Date.now()
    });

    inputField.value = "";

    // --- KEYBOARD FIX: Focus wapas input field par layein ---
    inputField.focus(); 
}


let holdTimer;
let isSelectionMode = false;
let selectedMessages = []; // Multi-select ke liye IDs yahan store hongi
let currentMsgToDelete = null;

function loadMessages() {
    const list = document.getElementById('message-list');
    
    db.ref('messages').on('child_added', (snapshot) => {
        const data = snapshot.val();
        const msgId = snapshot.key;
        const isMe = data.sender === currentUser;

        if (!isMe && data.status !== "read" && document.visibilityState === 'visible') {
            setTimeout(() => { db.ref('messages/' + msgId).update({ status: "read" }); }, 500);
        }

        const bubble = document.createElement('div');
        bubble.id = "msg-" + msgId;
        bubble.className = `msg-bubble ${isMe ? 'sent' : 'received'}`;

        bubble.oncontextmenu = (e) => {
            e.preventDefault();
            return false;
        };

        // Click Logic: Agar selection mode on hai toh select kare, varna normal click
        bubble.onclick = () => {
            if (isSelectionMode) {
                toggleMessageSelection(msgId);
            }
        };

        if (isMe) {
            bubble.onmousedown = () => startHold(msgId);
            bubble.onmouseup = () => clearHold();
            bubble.ontouchstart = () => startHold(msgId);
            bubble.ontouchend = () => clearHold();
        }

        let isRead = (data.status === "read");
        let seenClass = isRead ? "seen" : "closed";
        let statusHTML = isMe ? `<span class="status-icon ${seenClass}" id="status-${msgId}" style="display: inline-block; font-size: 20px; margin-left: 5px;">👁️</span>` : "";

        bubble.innerHTML = `
            <div>${data.text}</div>
            <div class="bubble-footer">
                <span class="msg-time">${data.time}</span>
                ${statusHTML}
            </div>
        `;
        list.appendChild(bubble);
        list.scrollTop = list.scrollHeight; 
    });

    db.ref('messages').on('child_removed', (snapshot) => {
        const msgId = snapshot.key;
        const element = document.getElementById("msg-" + msgId);
        if (element) element.remove();
    });
}

// --- Selection Logic Functions ---

function startHold(id) {
    if (isSelectionMode) return; // Mode on hai toh timer nahi chalega
    
    if (navigator.vibrate) navigator.vibrate(40);
    holdTimer = setTimeout(() => {
        enterSelectionMode(id);
    }, 800); 
}

function clearHold() {
    clearTimeout(holdTimer);
}

function enterSelectionMode(id) {
    isSelectionMode = true;
    document.getElementById('selection-bar').style.display = 'flex';
    toggleMessageSelection(id);
}

function toggleMessageSelection(id) {
    const el = document.getElementById("msg-" + id);
    const index = selectedMessages.indexOf(id);

    if (index > -1) {
        selectedMessages.splice(index, 1);
        el.classList.remove('selected');
    } else {
        selectedMessages.push(id);
        el.classList.add('selected');
    }

    document.getElementById('select-count').innerText = selectedMessages.length;
    if (selectedMessages.length === 0) exitSelectionMode();
}

function exitSelectionMode() {
    isSelectionMode = false;
    selectedMessages.forEach(id => {
        const el = document.getElementById("msg-" + id);
        if (el) el.classList.remove('selected');
    });
    selectedMessages = [];
    document.getElementById('selection-bar').style.display = 'none';
}

function deleteSelectedMessages() {
    if (confirm(`Delete ${selectedMessages.length} messages for everyone?`)) {
        selectedMessages.forEach(id => {
            db.ref('messages/' + id).remove();
        });
        exitSelectionMode();
    }
}

// Purane Modal functions bhi barkarar hain



// Professional Modal Functions
function openDeleteModal(id) {
    currentMsgToDelete = id;
    const overlay = document.getElementById('delete-overlay');
    const modal = document.getElementById('delete-modal');
    const modalText = document.getElementById('delete-modal-text');

    // Agar multi-select hai toh text badal jaye
    if (isSelectionMode && selectedMessages.length > 1) {
        modalText.innerText = `Delete ${selectedMessages.length} messages for everyone in this chat?`;
    } else {
        modalText.innerText = "This message will be deleted for everyone in this chat.";
    }

    overlay.style.display = 'block';
    modal.style.display = 'block';
    
    // Final delete button ka kaam
    document.getElementById('final-delete-btn').onclick = function() {
        if (isSelectionMode && selectedMessages.length > 0) {
            // Multi-delete logic
            selectedMessages.forEach(msgId => {
                db.ref('messages/' + msgId).remove();
            });
            exitSelectionMode();
        } else if (currentMsgToDelete) {
            // Single delete logic
            db.ref('messages/' + currentMsgToDelete).remove();
        }
        closeDeleteModal();
    };
}

function closeDeleteModal() {
    document.getElementById('delete-overlay').style.display = 'none';
    document.getElementById('delete-modal').style.display = 'none';
    currentMsgToDelete = null;
}

function deleteSelectedMessages() {
    if (selectedMessages.length > 0) {
        openDeleteModal(null); // Modal open karein bina single ID ke
    }
}
